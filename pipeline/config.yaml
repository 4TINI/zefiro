# Zefiro – configurazione della pipeline dati del prototipo.
#
# La pipeline scarica una sola volta i dati della finestra temporale indicata
# e li salva come JSON statici in web/public/data/.

window:
  start: "2026-02-10"   # primo giorno selezionabile nell'app
  end: "2026-02-16"     # ultimo giorno selezionabile nell'app
  history_days: 5       # giorni precedenti usati per l'evoluzione (neve, vento, bollettini)

aineva:
  bulletin_json: "https://bollettini.aineva.it/albina_files/{date}/{date}_AINEVA_it_CAAMLv6.json"
  micro_regions: "https://regions.avalanches.org/micro-regions/IT-21_micro-regions.geojson.json"
  # Nomi ufficiali EAWS (i nomi dentro il CAAML non sono affidabili).
  micro_region_names: "https://regions.avalanches.org/micro-regions_names/it.json"
  region_prefix: "IT-21"          # Piemonte
  treeline_m: 2000                # quota usata quando il bollettino dice "treeline"

meteo:
  # Historical Forecast API: archivio delle previsioni ad alta risoluzione,
  # include lo zero termico (non presente in ERA5).
  url: "https://historical-forecast-api.open-meteo.com/v1/forecast"
  hourly:
    - temperature_2m
    - precipitation
    - rain
    - snowfall
    - snow_depth
    - freezing_level_height
    - cloud_cover
    - wind_speed_10m
    - wind_gusts_10m
    - wind_direction_10m

dem:
  # Copernicus GLO-30, tile COG pubblici: si leggono solo i blocchi necessari.
  tile_url: "https://copernicus-dem-30m.s3.amazonaws.com/Copernicus_DSM_COG_10_{lat}_00_{lon}_00_DEM/Copernicus_DSM_COG_10_{lat}_00_{lon}_00_DEM.tif"
  sample_step_m: 25               # passo di ricampionamento della traccia
  margin_deg: 0.02                # margine attorno alla traccia (~2 km): area della vista 3D

siva:
  # Arpa Piemonte – Sistema Informativo Valanghe (SIVA), shapefile per provincia, CC BY 4.0.
  # Solo visualizzazione: non entra nel punteggio.
  zip_url: "https://webgis.arpa.piemonte.it/w-metadoc/Download/valanghe/valanghe.zip"
  buffer_m: 30                    # un punto della traccia "attraversa" un sito entro questa distanza
  events_radius_m: 1500           # eventi storici puntuali mostrati entro questo raggio

routes:
  - id: albergian-soucheres-basses
    name: "Monte Albergian da Soucheres Basses"
    valley: "Val Chisone"
    province: TO
    municipality: Pragelato
    gulliver_url: "https://www.gulliver.it/itinerari/albergian-monte-da-soucheres-basses/"
    difficulty: BS
    gulliver_aspect: "Nord-Ovest"
    gulliver_gain_m: 1565
    start_name: "Soucheres Basses"
    summit_name: "Monte Albergian"
    description: >-
      Dalla frazione di Soucheres Basses per la forestale verso Capanna d'Amont.
      Fuori dal bosco si risale l'ampio vallone, la Côte de la Saume e il pendio
      fino al colletto a monte della Côte Blegier. Per cresta fin sotto la croce.
      Con neve dura l'ultimo pendio ripido a 2900 m richiede ramponi.
    track:
      # Traccia GPX pubblicata su Gulliver (salita + discesa): si tiene solo la salita.
      gpx_url: "https://www.gulliver.it/wp-content/uploads/2025/02/Albergian_skialp.gpx"
    reports:
      # Inserite a mano dalle pagine Gulliver (nessuno scraping automatico).
      - date: "2026-02-07"
        user: giovanni-bonino
        relation: nearby
        route_name: "Gran Costa (Monte) da Ruà"
