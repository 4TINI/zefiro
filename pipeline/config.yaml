        rating: null
        snow_top: "Crosta da rigelo non portante"
        snow_bottom: "Crosta da rigelo non portante"
        snow_line_m: 1500
        observations: "Nessuno"
        summary: "Scelta prudente su pendii poco inclinati. Manto trasformato e assestato, discesa quasi tutta in crosta molto faticosa."
