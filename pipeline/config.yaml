  - id: chersogno-campiglione
    name: "Monte Chersogno da Campiglione"
    valley: "Valle Maira"
    province: CN
    municipality: Prazzo
    gulliver_url: "https://www.gulliver.it/itinerari/chersogno-monte-da-campiglione/"
    difficulty: BSA
    gulliver_aspect: "Tutte"
    gulliver_gain_m: 1312
    start_name: "Campiglione"
    summit_name: "Monte Chersogno"
    description: >-
      Oltre le Grange Chiotti si raggiunge la conca sotto la parete est del
      Chersogno. Con un ampio semicerchio si sale al Colle di Chiosso e ci si
      immette a metà del ripido canale che porta al piano del Vallone. Si sale
      alla depressione a 2880 m a est del Passo Chersogno e per la cresta ovest
      alla croce di vetta.
    track:
      # Nessuna traccia GPX su Gulliver: waypoint da OpenStreetMap + descrizione.
      # Tra un waypoint e l'altro la pipeline calcola il percorso a costo minimo
      # sul DEM (penalizza i pendii ripidi): è una traccia STIMATA.
      snap_to_terrain: true
      waypoints:
        - [44.51788, 7.04568, "Campiglione"]
        - [44.52370, 7.03886, "Grange Chiotti"]
        - [44.53321, 7.02469, "Colle di Chiosso Ovest"]
        - [44.52580, 7.01780, "Depressione 2880 m"]
        - [44.52681, 7.02008, "Monte Chersogno"]
    reports:
      - date: "2026-02-01"
        user: frax
        relation: nearby
        route_name: "Chersogno (Monte) da Chiosso"
        url: "https://www.gulliver.it/itinerari/chersogno-monteda-chiosso/2026/02/01/337254/"
        rating: 4
        snow_top: "Farinosa ventata"
        snow_bottom: "Crosta da rigelo portante"
        snow_line_m: null
        observations: "Nessuno"
        summary: "Stessa vetta dal versante di Elva. Farinosa ventata in alto, crosta portante in basso."
      - date: "2024-03-19"
        user: giovanni-o
        relation: same
        url: "https://www.gulliver.it/itinerari/chersogno-monte-da-campiglione/2024/03/19/301848/"
        rating: 4
        snow_top: null
        snow_bottom: null
        snow_line_m: null
        observations: null
        summary: "Ultima relazione sulla gita (stagione 2024)."
